# 把 web/ 部署到 GitHub Pages(資料從 Cloudflare R2 讀,見 web/js/config.js)
name: Deploy web to Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 每次部署在 CSS / JS 網址加版本號(commit),瀏覽器才不會拿到「新 HTML + 快取裡的舊 JS」而壞掉
      - name: Cache-bust asset URLs
        run: |
          V=${GITHUB_SHA::7}
          sed -i -E "s#(href=\"css/[^\"]+\.css)\"#\1?v=$V\"#; s#(src=\"js/[^\"]+\.js)\"#\1?v=$V\"#" web/index.html
          find web/js -name '*.js' -exec sed -i -E "s#(from '\.{1,2}/[^']+\.js)'#\1?v=$V'#g" {} +
          # 標題旁的版本號:部署日期(台灣時間)· commit
          D=$(TZ=Asia/Taipei date +%Y.%m.%d)
          sed -i -E "s#(id=\"app-ver\"[^>]*>)dev<#\1v$D · $V<#" web/index.html
          grep -n "?v=\|app-ver" web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
