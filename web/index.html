<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SW-Watch 劇烈天氣監控</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/uplot@1.6.30/dist/uPlot.min.css">
  <script src="https://unpkg.com/uplot@1.6.30/dist/uPlot.iife.min.js"></script>
</head>
<body>
  <div id="map"></div>

  <header id="topbar">
    <div class="brand"><img src="assets/logo.svg" alt="" width="30" height="30"><b>SW<i>-Watch</i></b><span>劇烈天氣監控</span></div>
    <button id="btn-shot" class="toggle" title="地圖擷取：選尺寸、調整框內範圍，存成 PNG">📷 擷取</button>
    <div id="clock">
      <div id="clock-main">--</div>
      <div id="clock-sub"><span id="clock-utc"></span><span class="ver" id="app-ver" title="網站版本(部署日期 · commit)">dev</span></div>
    </div>
  </header>

  <aside id="panel">
    <section>
      <h3>圖層</h3>

      <div class="layer" data-layer="satellite">
        <label class="layer-head">
          <input type="checkbox" id="chk-satellite" checked>
          <span class="layer-name">衛星雲圖</span>
          <span class="layer-time" id="time-satellite">--</span>
        </label>
        <div class="layer-opts">
          <label>頻道
            <select id="sat-band">
              <option value="B13">B13 紅外線</option>
              <option value="B07">B07 短波紅外（夜間低雲、霧）</option>
              <option value="FOG">夜間低雲／霧（B13−B07）</option>
              <option value="B08">B08 水氣</option>
              <option value="B03">B03 可見光</option>
              <option value="DN">日夜（B03 白天／B07 夜間）</option>
            </select>
            <select id="sat-style">
              <option value="bd">增強色階</option>
              <option value="gray">灰階</option>
            </select>
          </label>
          <label>透明度 <input type="range" id="op-satellite" min="0" max="100" value="100"></label>
        </div>
      </div>

      <div class="layer" data-layer="radar">
        <label class="layer-head">
          <input type="checkbox" id="chk-radar" checked>
          <span class="layer-name">雷達回波</span>
          <span class="layer-time" id="time-radar">--</span>
        </label>
        <div class="layer-opts">
          <label>透明度 <input type="range" id="op-radar" min="0" max="100" value="85"></label>
        </div>
      </div>

      <div class="layer" data-layer="ecmwf">
        <label class="layer-head">
          <input type="checkbox" id="chk-ecmwf">
          <span class="layer-name">ECMWF 預報</span>
          <span class="layer-time" id="time-ecmwf">--</span>
        </label>
        <div class="layer-opts">
          <label>變數
            <select id="ec-var">
              <option value="rain">降雨</option>
              <option value="t2">溫度</option>
              <option value="msl">海平面氣壓</option>
              <option value="wind">平均風</option>
              <option value="gust">陣風</option>
            </select>
            <select id="ec-rain">
              <option value="3">3 小時</option><option value="6">6 小時</option>
              <option value="12">12 小時</option><option value="24">24 小時</option>
              <option value="0">起報後累積</option>
            </select>
          </label>
          <label>初始 <select id="ec-init"></select></label>
          <label>
            <button id="ec-prev" title="上一個時刻">◀</button>
            <select id="ec-step"></select>
            <button id="ec-next" title="下一個時刻">▶</button>
          </label>
          <div class="ec-play">
            <button id="ec-play" title="播放預報（和下方時間軸分開）">▶ 播放</button>
            <button id="ec-pause" title="暫停">⏸ 暫停</button>
          </div>
          <div class="ty-toggles">
            <label title="預報時刻跟著下方時間軸（時間軸停在哪就顯示那之前最近的時刻）"><input type="checkbox" id="ec-follow"> 對齊時間軸</label>
          </div>
          <label>透明度 <input type="range" id="op-ecmwf" min="0" max="100" value="80"></label>
        </div>
      </div>

      <div class="layer" data-layer="stations">
        <label class="layer-head">
          <input type="checkbox" id="chk-stations" checked>
          <span class="layer-name">測站觀測</span>
          <span class="layer-time" id="time-stations">--</span>
        </label>
        <div class="layer-opts">
          <label>變數 <select id="st-var"></select></label>
          <label>顯示
            <select id="st-stat">
              <option value="now">當前值</option>
              <option value="max">過去最大</option>
              <option value="min">過去最小</option>
              <option value="sum">區段累積（雨量）</option>
            </select>
            <select id="st-hours" disabled>
              <option value="1">1 小時</option><option value="2">2 小時</option>
              <option value="3">3 小時</option><option value="6">6 小時</option>
              <option value="12">12 小時</option><option value="24">24 小時</option>
              <option value="48">48 小時</option><option value="72">72 小時</option>
              <option value="custom">自訂區段</option>
            </select>
          </label>
          <div id="st-custom" hidden>
            <label>起 <input type="datetime-local" id="st-cstart" step="600"></label>
            <label>迄 <input type="datetime-local" id="st-cend" step="600"> <button type="button" id="st-cend-clear" title="迄留空 = 跟著時間軸">清除</button></label>
            <div class="hint">台灣時間，10 分鐘一格；迄留空 = 時間軸目前時間</div>
          </div>
          <label>透明度 <input type="range" id="op-stations" min="0" max="100" value="100"></label>
          <label>搜尋 <input type="search" id="st-search" list="st-list" placeholder="站名或站號，例如 臺北、466920"></label>
          <datalist id="st-list"></datalist>
          <details id="st-county-box">
            <summary>縣市 <span id="st-county-sum">全部</span></summary>
            <div class="st-county-btns"><button type="button" id="st-county-all">全選</button><button type="button" id="st-county-none">全不選</button></div>
            <div id="st-counties"></div>
          </details>
          <label><input type="checkbox" id="st-labels" checked> 地圖上顯示數值文字</label>
          <div class="ty-toggles" id="st-types">
            <span>站種</span>
            <label><input type="checkbox" value="manned" checked> 局屬站</label>
            <label><input type="checkbox" value="auto" checked> 自動站</label>
            <label><input type="checkbox" value="rain" checked> 雨量站</label>
            <label title="宮古、八重山、沖繩本島、奄美的 AMeDAS 測站(出典：気象庁)"><input type="checkbox" value="jma" checked> 日本氣象廳</label>
          </div>
          <div class="st-rank-head">
            <label><input type="checkbox" id="st-rank-on"> 排行榜</label>
            <select id="st-rank-order"><option value="desc">高 → 低</option><option value="asc">低 → 高</option></select>
            <select id="st-rank-n"><option>10</option><option>20</option><option>50</option></select>
          </div>
          <ol id="st-rank" hidden></ol>
        </div>
      </div>

      <div class="layer" data-layer="typhoon">
        <label class="layer-head">
          <input type="checkbox" id="chk-typhoon" checked>
          <span class="layer-name">颱風路徑（氣象署）</span>
          <span class="layer-time" id="time-typhoon">--</span>
        </label>
        <div class="layer-opts">
          <label>預報初始
            <select id="ty-issue"><option value="">依時間軸</option></select>
          </label>
          <div class="ty-toggles">
            <label><input type="checkbox" id="ty-cone" checked> 70% 潛勢區</label>
            <label><input type="checkbox" id="ty-names" checked> 颱風名稱</label>
            <label><input type="checkbox" id="ty-labels" checked> 時間標示</label>
          </div>
          <div class="ty-toggles">
            <button type="button" class="toggle" id="ty-anim" title="颱風沿路徑移動並顯示當時的暴風圈；點路徑線可看任一時間的位置與暴風圈">▶ 路徑動畫</button>
            <label title="從目前位置走到最後預報點的速度（每秒走幾小時的預報），不受路徑長短影響">速度
              <select id="ty-anim-speed">
                <option value="3">每秒 3 小時</option><option value="6" selected>每秒 6 小時</option>
                <option value="12">每秒 12 小時</option><option value="24">每秒 24 小時</option>
              </select>
            </label>
          </div>
          <div class="ty-toggles">
            <span>暴風圈</span>
            <label><input type="checkbox" data-ty-circle="now" checked> 目前</label>
            <label><input type="checkbox" data-ty-circle="fcst" checked> 預報</label>
            <label><input type="checkbox" data-ty-circle="past"> 過去</label>
            <select id="ty-circle-shape" title="四象限：氣象署各象限半徑；平均：平均半徑畫正圓">
              <option value="quad">四象限</option><option value="avg">平均</option>
            </select>
          </div>
          <div class="ty-style">
            <span>暴風圈</span><span>目前</span><span>預報</span>
            <span>線寬 px</span>
            <input type="number" class="num" id="ty-w-now" min="0" max="8" step="0.5" value="1.8">
            <input type="number" class="num" id="ty-w-fcst" min="0" max="8" step="0.5" value="1">
            <span>填色 %</span>
            <input type="number" class="num" id="ty-fill-now" min="0" max="100" step="1" value="20">
            <input type="number" class="num" id="ty-fill-fcst" min="0" max="100" step="1" value="4">
          </div>
          <div id="ty-storms"></div>
        </div>
      </div>

      <div class="layer" data-layer="ens">
        <label class="layer-head">
          <input type="checkbox" id="chk-ens" checked>
          <span class="layer-name">系集路徑</span>
          <span class="layer-time" id="time-ens">--</span>
        </label>
        <div class="layer-opts">
          <label>颱風 <select id="ens-tc"></select></label>
          <label>初始時間 <select id="ens-init"></select></label>
          <div class="seg">
            <label><input type="radio" name="ens-mode" value="tau" checked> 預報時距（各模式）</label>
            <label><input type="radio" name="ens-mode" value="valid"> 有效時間對齊</label>
          </div>
          <div id="ens-valid-box" hidden>
            <label>起點 <select id="ens-valid-start"></select></label>
            <label>長度
              <select id="ens-valid-hours">
                <option value="24">24 小時</option><option value="48">48 小時</option>
                <option value="72">72 小時</option><option value="96">96 小時</option>
                <option value="120" selected>120 小時</option><option value="168">168 小時</option>
                <option value="240">240 小時</option>
              </select>
            </label>
          </div>
          <div id="ens-models"></div>
          <div class="ty-toggles">
            <label><input type="checkbox" data-ens-opt="dropOutlier" checked> 排除離群</label>
            <label><input type="checkbox" data-ens-opt="best" checked> 實際路徑</label>
            <label><input type="checkbox" data-ens-opt="start" checked> 起點</label>
          </div>
        </div>
      </div>
    </section>

    <section>
      <h3>底圖</h3>
      <select id="basemap">
        <option value="light">素色（淺）</option>
        <option value="dark">素色（深）</option>
        <option value="imagery">衛星影像</option>
      </select>
      <div class="ty-toggles" style="margin-top:6px;color:var(--muted)">
        <label><input type="checkbox" id="chk-grid" checked> 經緯網格</label>
        <label><input type="checkbox" id="chk-county" checked> 縣市界</label>
        <label><input type="checkbox" id="chk-km100" checked> 100 公里線</label>
      </div>
      <button id="btn-reset-prefs" class="reset-prefs" title="設定會自動存在這個瀏覽器，重新整理後還原">還原預設設定</button>
    </section>
  </aside>

  <aside id="st-card" hidden>
    <div class="sc-head">
      <div><div id="sc-title"></div><div id="sc-sub"></div></div>
      <button id="sc-close" title="關閉">✕</button>
    </div>
    <div id="sc-now"></div>
    <div class="sc-tabs">
      <button data-tab="temp">溫度</button><button data-tab="rh">濕度</button><button data-tab="pres">氣壓</button>
      <button data-tab="wind">風</button><button data-tab="rain">雨量</button>
      <select id="sc-hours" title="圖表時段"></select>
    </div>
    <div id="sc-chart"></div>
    <div id="sc-note"></div>
  </aside>

  <div id="readout"></div>
  <div id="legend">
    <div id="legend-ctl"><span id="legend-name">色階</span><button id="legend-fold" title="收合色階">▾</button><button id="legend-minus" title="色階縮小">−</button><button id="legend-plus" title="色階放大">＋</button></div>
    <div id="legend-body"></div>
  </div>

  <footer id="timeline">
    <button id="btn-sync" class="toggle" title="同步：所有圖層對齊同一時間；不同步：各自顯示最新">🔗 同步</button>
    <button id="btn-prev" title="上一格（←）">◀</button>
    <button id="btn-play" title="播放／暫停（空白鍵）">▶</button>
    <button id="btn-next" title="下一格（→）">▶|</button>
    <div id="slider-wrap">
      <canvas id="coverage"></canvas>
      <input type="range" id="slider" min="0" max="0" value="0">
      <div id="slider-ticks"></div>
    </div>
    <button id="btn-latest" title="跳到最新">最新</button>
    <label class="tl-opt" title="時間軸顯示的長度，也是播放的範圍">範圍
      <select id="play-range">
        <option value="1">1 小時</option>
        <option value="3" selected>3 小時</option>
        <option value="6">6 小時</option>
        <option value="12">12 小時</option>
        <option value="24">24 小時</option>
        <option value="48">2 天</option>
        <option value="72">3 天</option>
        <option value="168">7 天</option>
      </select>
    </label>
    <label class="tl-opt">速度
      <select id="play-speed">
        <option value="1000">慢</option>
        <option value="500" selected>中</option>
        <option value="250">快</option>
      </select>
    </label>
  </footer>

  <div id="shot-frame" hidden></div>
  <div id="shot-ui" hidden>
    <div class="shot-row"><b>地圖擷取</b><span class="muted">移動、縮放地圖調整框內範圍（Esc 關閉）</span></div>
    <div class="shot-row">
      <label>尺寸
        <select id="shot-size">
          <option value="16:9">16:9（1920×1080）</option>
          <option value="4:3">4:3（1600×1200）</option>
          <option value="1:1">1:1（1080×1080）</option>
          <option value="9:16">9:16（1080×1920）</option>
          <option value="A4L">A4 橫（300 dpi）</option>
          <option value="A4P">A4 直（300 dpi）</option>
          <option value="custom">自訂</option>
        </select>
      </label>
      <input id="shot-w" type="number" class="num" min="100" max="10000"> × <input id="shot-h" type="number" class="num" min="100" max="10000"> px
      <label><input type="checkbox" id="shot-lock"> 鎖定比例</label>
      <label>倍率 <select id="shot-mult"><option value="1">1×</option><option value="2">2×</option></select></label>
    </div>
    <div class="shot-row">
      <label><input type="checkbox" id="shot-title"> 標題</label>
      <label><input type="checkbox" id="shot-time"> 資料時間</label>
      <label><input type="checkbox" id="shot-legend"> 色階</label>
      <label><input type="checkbox" id="shot-source"> 資料來源</label>
      <label><input type="checkbox" id="shot-scale"> 比例尺</label>
      <label><input type="checkbox" id="shot-grid"> 經緯網格</label>
    </div>
    <div class="shot-row"><button id="shot-go" class="toggle on">下載 PNG</button><button id="shot-cancel">取消</button><span id="shot-info" class="muted"></span></div>
  </div>
  <div id="toast"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
